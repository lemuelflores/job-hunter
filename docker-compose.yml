name: job-hunter

x-service: &service
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app: &app
  <<: *service
  image: node:22-bookworm-slim
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /app
  entrypoint: [node, dist/entrypoints/cli.js]
  init: true
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379
  volumes:
    - .:/app
  stop_grace_period: 2m

services:
  web:
    <<: *app
    command: [serve]
    environment:
      JOB_HUNTER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"

  workers:
    <<: *app
    command: [workers]
    stop_grace_period: 3m
    environment:
      FIRECRAWL_URL: http://firecrawl:3002
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: [scheduler]
    environment:
      GOOGLE_CRON: ${GOOGLE_CRON:-0 * * * *}
      FREEHIRE_CRON: ${FREEHIRE_CRON:-*/15 * * * *}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  firecrawl:
    <<: *service
    image: ghcr.io/firecrawl/firecrawl:2.11.528
    # Single-page scraping runs in the API; no crawl/batch workers are needed.
    command: node dist/src/index.js
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright:3000/scrape
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/v0/health/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      redis:
        condition: service_started
      playwright:
        condition: service_started
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G

  playwright:
    <<: *service
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: 10
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  redis-test:
    image: redis:8.10.2-alpine
    profiles: [test]
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data

  redis:
    <<: *service
    image: redis:8.10.2-alpine
    command: redis-server --bind 0.0.0.0 --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  backend:
    driver: bridge

volumes:
  redis-data:
