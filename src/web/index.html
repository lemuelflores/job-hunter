<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jobs to review</title>
    <script type="module" src="./main.js"></script>
    <style>
    [x-cloak] {
      /* biome-ignore lint/complexity/noImportantStyles: Hide Alpine templates before initialization regardless of component display styles. */
      display: none !important;
    }
    :root {
      color-scheme: light;
      --ink: #21332f;
      --muted: #596b65;
      --line: #dce5df;
      --paper: #f2f6f2;
      --card: #fffefa;
      --accent: #176b52;
      --accent-soft: #e6f1eb;
      --danger: #9f3e3e;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font:
        15px / 1.65 system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }
    main {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;
      padding: 24px 0 80px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .toolbar__tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: #e5ece5;
    }
    a,
    button {
      -webkit-tap-highlight-color: transparent;
    }
    .toolbar__tab {
      border: 0;
      border-radius: 7px;
      padding: 8px 11px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .toolbar__tab:hover {
      color: var(--ink);
    }
    .toolbar__tab[aria-pressed="true"] {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 3px #1d242114;
    }
    .filter {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .filter__select {
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 28px 9px 10px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .notice {
      min-height: 24px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .notice--error {
      color: var(--danger);
    }
    .job-list {
      position: relative;
      overflow-anchor: none;
      margin: 0;
      padding: 0;
    }
    .job-row {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      min-width: 0;
      overflow: hidden;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }
    .job-row__summary {
      grid-column: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 18px;
      padding: 16px 20px;
    }
    .job-row__title {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 600;
    }
    .job-row__title-link {
      color: inherit;
      text-decoration: none;
    }
    .job-row__metadata {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .job-row__metadata > span:first-child {
      font-weight: 500;
    }
    .job-row__location::before {
      content: "·";
      margin-right: 10px;
    }
    .job-row__admin {
      grid-column: 2;
      grid-row: 1 / span 2;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 16px;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .job-row__dates {
      display: flex;
      flex-direction: column;
    }
    .job-row__date {
      display: block;
    }
    .job-row__date--posted {
      font-weight: inherit;
    }
    .job-row__source {
      margin-top: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 5px;
      font-size: 10px;
      white-space: nowrap;
    }
    .job-row__source--google {
      border-color: #c6d9fb;
      background: #e5eeff;
      color: #2456a6;
    }
    .job-row__source--freehire {
      border-color: #ddcef5;
      background: #eee5fc;
      color: #7140a0;
    }
    .assessment {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .assessment ~ .assessment {
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }
    .assessment__heading {
      display: flex;
      align-items: baseline;
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .assessment__status {
      display: inline-block;
      flex: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 7px;
      background: #edf0ed;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }
    .assessment__status--eligible,
    .assessment__status--match {
      border-color: #c4dfd0;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .assessment__status--unclear,
    .assessment__status--partial-match,
    .assessment__status--potential-match {
      border-color: #eadcb6;
      background: #fcf4df;
      color: #795a19;
    }
    .assessment__status--ineligible {
      background: #f4ece8;
      color: #855141;
    }
    .assessment__status--error {
      background: #fce8e8;
      color: var(--danger);
    }
    .assessment__explanation {
      display: block;
      width: 100%;
      max-width: 90ch;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      line-height: 1.55;
      text-align: left;
      cursor: pointer;
    }
    .assessment__text {
      white-space: pre-line;
    }
    .assessment__hint {
      margin-left: 5px;
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .job-row__errors {
      grid-column: 1;
      padding: 0 20px;
    }
    .job-row__error {
      padding: 10px 14px;
      border-left: 3px solid var(--danger);
      background: #fce8e8;
      color: var(--danger);
      font-size: 13px;
    }
    .job-row__actions {
      align-self: stretch;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
    }
    .button.job-row__link {
      display: inline-flex;
      align-items: center;
      border-color: #c4dfd0;
      background: var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
    }
    .button.job-row__link:hover {
      border-color: #91bda5;
      background: #d9eade;
    }
    .button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 13px;
      background: var(--card);
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .button:hover {
      border-color: #aab9b0;
      background: #f7faf7;
    }
    .button--danger {
      border-color: #e8cccc;
      background: #fff5f3;
      color: var(--danger);
    }
    .button--danger:hover {
      border-color: #ce9999;
      background: #fce8e8;
    }
    .button:focus-visible,
    .assessment__explanation:focus-visible,
    .job-row__title:focus-visible,
    .toolbar__tab:focus-visible,
    .filter__select:focus-visible,
    a:focus-visible {
      outline: 3px solid #8fc6ae;
      outline-offset: 3px;
    }
    .button:disabled {
      cursor: wait;
      opacity: 0.55;
    }
    .empty {
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty__title {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-family: Georgia, serif;
      font-size: 19px;
    }
    @media (max-width: 760px) {
      main {
        width: calc(100% - 24px);
      }
      .toolbar {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
      }
      .toolbar__tabs {
        width: fit-content;
        max-width: 100%;
        overflow: auto;
      }
      .filter {
        justify-content: space-between;
      }
      .job-row {
        grid-template-columns: minmax(0, 1fr) 132px;
      }
      .job-row__admin {
        padding: 16px 10px;
      }
    }
    </style>
  </head>
  <body>
    <main
      x-data="jobReview()"
      @popstate.window="restoreView()"
      @visibilitychange.document="refresh()"
      @resize.window="resizeVirtual()"
    >
      <h1>Job listings</h1>
      <div class="toolbar">
        <nav class="toolbar__tabs" aria-label="Job status">
          <button
            class="toolbar__tab"
            type="button"
            data-status="active"
            :aria-pressed="status === 'active'"
            @click="selectView({ status: 'active' })"
          >
            Active
          </button>
          <button
            class="toolbar__tab"
            type="button"
            data-status="hidden"
            :aria-pressed="status === 'hidden'"
            @click="selectView({ status: 'hidden' })"
          >
            Hidden
          </button>
          <button
            class="toolbar__tab"
            type="button"
            data-status="rejected"
            :aria-pressed="status === 'rejected'"
            @click="selectView({ status: 'rejected' })"
          >
            Rejected
          </button>
        </nav>
        <label class="filter"
          >Location eligibility
          <select
            id="eligibility"
            class="filter__select"
            :value="eligibility"
            @change="selectView({ eligibility: $event.target.value })"
          >
            <option value="all">All</option>
            <option value="eligible">Eligible</option>
            <option value="pending">Pending</option>
            <option value="unclear">Unclear</option>
            <option value="ineligible">Ineligible</option>
            <option value="error">Error</option>
          </select></label
        >
        <label class="filter"
          >Stack assessment
          <select
            id="stack"
            class="filter__select"
            :value="stack"
            @change="selectView({ stack: $event.target.value })"
          >
            <option value="all">All</option>
            <option value="not_checked">Not checked / Skipped</option>
            <option value="pending">Pending</option>
            <option value="match">Match</option>
            <option value="partial_match">Partial match</option>
            <option value="potential_match">Potential match</option>
            <option value="unclear">Unclear</option>
            <option value="error">Error</option>
          </select></label
        >
      </div>
      <div
        id="notice"
        class="notice"
        :class="{ 'notice--error': saveError || loadError }"
        role="status"
        aria-live="polite"
        x-text="notice"
      ></div>
      <button
        x-cloak
        x-show="loadError"
        class="button"
        type="button"
        @click="load(true)"
      >
        Retry
      </button>
      <ul
        id="jobs"
        class="job-list"
        x-ref="virtualList"
        :style="{ height: `${totalSize}px` }"
        aria-label="Job listings"
        :aria-busy="loading"
        @focusin="syncVirtual()"
        @focusout="$nextTick(() => syncVirtual())"
        x-cloak
      >
        <template x-for="job in renderedJobs" :key="job.reviewKey">
          <li
            class="job-row"
            :aria-posinset="job.virtualIndex + 1"
            :aria-setsize="visibleJobs.length"
            :data-review-key="job.reviewKey"
            :data-index="job.virtualIndex"
            :style="{ transform: `translateY(${job.virtualStart}px)` }"
            x-effect="job.virtualIndex; $nextTick(() => measureRow($el))"
          >
            <div class="job-row__summary">
              <div class="job-row__identity">
                <h2
                  class="job-row__title"
                  :id="`job-title-${job.reviewKey}`"
                  tabindex="-1"
                >
                  <!-- biome-ignore lint/a11y/useValidAnchor: Alpine binds the validated listing URL. -->
                  <a
                    class="job-row__title-link"
                    x-show="safeUrl(job.url)"
                    :href="safeUrl(job.url)"
                    :aria-label="`View job: ${job.title || 'Untitled role'} (opens in new tab)`"
                    target="_blank"
                    rel="noopener noreferrer"
                    x-text="job.title || 'Untitled role'"
                    >Untitled role</a
                  >
                  <span
                    x-show="!safeUrl(job.url)"
                    x-text="job.title || 'Untitled role'"
                  ></span>
                </h2>
                <div class="job-row__metadata">
                  <span
                    x-text="displayText(job.company, 'Company not provided')"
                  ></span>
                  <span
                    class="job-row__location"
                    x-text="displayText(job.location, 'Location not provided')"
                  ></span>
                </div>
              </div>
              <template x-for="panel in assessments(job)" :key="panel.title">
                <section
                  class="assessment"
                  x-data="assessmentState(job.reviewKey, panel.title)"
                  :aria-labelledby="`assessment-${job.reviewKey}-${panel.title.split(' ')[0]}`"
                >
                  <h3
                    class="assessment__heading"
                    :id="`assessment-${job.reviewKey}-${panel.title.split(' ')[0]}`"
                  >
                    <span
                      class="assessment__status"
                      :class="`assessment__status--${panel.status.replaceAll('_', '-')}`"
                      x-text="panel.title.split(' ')[0] + ' ' + panel.label"
                      >Assessment</span
                    >
                  </h3>
                  <button
                    class="assessment__explanation"
                    type="button"
                    :aria-pressed="showEvidence"
                    @click="showEvidence = !showEvidence"
                  >
                    <span
                      class="assessment__text"
                      x-text="showEvidence ? (panel.evidence || 'No evidence available yet.') : (panel.reason || 'No assessment available yet.')"
                    ></span>
                    <span
                      class="assessment__hint"
                      x-text="showEvidence ? 'See reason' : 'See evidence'"
                    ></span>
                  </button>
                </section>
              </template>
            </div>
            <div class="job-row__admin">
              <div class="job-row__dates">
                <span class="job-row__date job-row__date--posted">
                  <span>Posted</span>
                  <time
                    :datetime="job.posted_at || null"
                    x-text="relativeDate(job.posted_at) || 'date unknown'"
                  ></time>
                </span>
                <span class="job-row__date">
                  <span>Found</span>
                  <time
                    :datetime="job.first_seen"
                    x-text="relativeDate(job.first_seen) || 'date unknown'"
                  ></time>
                </span>
              </div>
              <span
                class="job-row__source"
                :class="{ 'job-row__source--google': job.source === 'google', 'job-row__source--freehire': job.source === 'freehire' }"
                :aria-label="`Source: ${{ google: 'Google', freehire: 'Freehire' }[job.source] || 'Unknown'}`"
                x-text="{ google: 'Google', freehire: 'Freehire' }[job.source] || 'Unknown'"
              ></span>
              <div class="job-row__actions">
                <!-- biome-ignore lint/a11y/useValidAnchor: Alpine binds the validated listing URL. -->
                <a
                  class="button job-row__link"
                  x-show="safeUrl(job.url)"
                  :href="safeUrl(job.url)"
                  :aria-label="`View job: ${job.title || 'Untitled role'} (opens in new tab)`"
                  target="_blank"
                  rel="noopener noreferrer"
                  >View</a
                >
                <button
                  class="button"
                  type="button"
                  x-show="status === 'active'"
                  :disabled="!!pending[job.reviewKey]"
                  @click="updateStatus(job, 'hidden')"
                >
                  Hide
                </button>
                <button
                  class="button button--danger"
                  type="button"
                  x-show="status === 'active'"
                  :disabled="!!pending[job.reviewKey]"
                  @click="updateStatus(job, 'rejected')"
                >
                  Reject
                </button>
                <button
                  class="button"
                  type="button"
                  x-show="status !== 'active'"
                  :disabled="!!pending[job.reviewKey]"
                  @click="updateStatus(job, 'active')"
                >
                  Restore
                </button>
              </div>
            </div>
            <div class="job-row__errors">
              <template
                x-for="stage in (job.stages || []).filter(item => item.error)"
                :key="stage.stage"
              >
                <p
                  class="job-row__error"
                  x-text="`${stage.stage}: ${stage.state} — ${stage.error}`"
                ></p>
              </template>
            </div>
          </li>
        </template>
      </ul>
      <div
        class="empty"
        x-cloak
        x-show="!visibleJobs.length && !loadError && (!loading || cache[status])"
      >
        <strong
          class="empty__title"
          x-text="status === 'active' ? 'Nothing here yet' : `No ${status} jobs`"
        ></strong>
        <span
          x-text="status === 'active' ? 'Jobs will appear after your next run.' : 'Jobs you move here will stay available for review.'"
        ></span>
      </div>
    </main>
  </body>
</html>
