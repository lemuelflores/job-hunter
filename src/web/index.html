<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jobs to review</title>
    <script defer src="/alpine.js"></script>
    <style>
    [x-cloak] {
      /* biome-ignore lint/complexity/noImportantStyles: Hide Alpine templates before initialization regardless of component display styles. */
      display: none !important;
    }
    :root {
      color-scheme: light;
      --ink: #21332f;
      --muted: #596b65;
      --line: #dce5df;
      --paper: #f2f6f2;
      --card: #fffefa;
      --accent: #176b52;
      --accent-soft: #e6f1eb;
      --danger: #9f3e3e;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font:
        15px / 1.65 system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }
    main {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;
      padding: 56px 0 80px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .toolbar__tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: #e5ece5;
    }
    a,
    button {
      -webkit-tap-highlight-color: transparent;
    }
    .toolbar__tab {
      border: 0;
      border-radius: 7px;
      padding: 8px 11px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .toolbar__tab:hover {
      color: var(--ink);
    }
    .toolbar__tab[aria-pressed="true"] {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 3px #1d242114;
    }
    .filter {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .filter__select {
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 28px 9px 10px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .notice {
      min-height: 24px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .notice--error {
      color: var(--danger);
    }
    .job-list {
      display: grid;
      gap: 24px;
    }
    .job-card {
      min-width: 0;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 30px 20px;
      background: var(--card);
      box-shadow: 0 4px 18px #27352c04;
    }
    .job-card__header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 16px;
    }
    .job-card__title {
      margin: 0;
      text-wrap: pretty;
      font-size: 23px;
      font-weight: 650;
      line-height: 1.3;
      letter-spacing: -0.025em;
    }
    .job-card__company {
      color: var(--ink);
      font-weight: 600;
    }
    .job-card__metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin: 12px 0 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .job-card__metadata-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .assessment__status {
      flex: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      background: #edf0ed;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .job-card__assessments {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .assessment {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      min-width: 0;
    }
    .assessment + .assessment {
      border-top: 1px solid var(--line);
    }
    .assessment__header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 18px;
      border-right: 1px solid var(--line);
      background: #f8faf6;
    }
    .assessment__content {
      min-width: 0;
      padding: 18px;
    }
    .assessment__status--eligible,
    .assessment__status--match {
      border-color: #c4dfd0;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .assessment__status--unclear,
    .assessment__status--partial-match,
    .assessment__status--potential-match {
      border-color: #eadcb6;
      background: #fcf4df;
      color: #795a19;
    }
    .assessment__status--ineligible {
      background: #f4ece8;
      color: #855141;
    }
    .assessment__status--error {
      background: #fce8e8;
      color: var(--danger);
    }
    .assessment__title {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
    }
    .assessment__reason {
      margin: 0;
      max-width: 68ch;
    }
    .assessment__reason--empty {
      color: var(--muted);
    }
    .assessment__evidence {
      margin-top: 14px;
    }
    .assessment__toggle {
      width: fit-content;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .assessment__quote {
      margin: 12px 0 0;
      padding: 10px 14px;
      border-left: 2px solid #b5cfc0;
      border-radius: 0 8px 8px 0;
      background: #f3f6f0;
      color: #43594f;
      font-size: 14px;
      white-space: pre-line;
    }
    .job-card__error {
      padding: 10px 14px;
      border-left: 3px solid var(--danger);
      background: #fce8e8;
      color: var(--danger);
      font-size: 13px;
    }
    .job-card__actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .job-card__review-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }
    .job-card__link {
      color: var(--accent);
      font-size: 14px;
      font-weight: 650;
      text-underline-offset: 4px;
    }
    .button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 13px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .button:hover {
      border-color: #aab9b0;
      background: #f7faf7;
    }
    .button--danger {
      color: var(--danger);
    }
    .button:focus-visible,
    .toolbar__tab:focus-visible,
    .filter__select:focus-visible,
    a:focus-visible,
    .assessment__toggle:focus-visible {
      outline: 3px solid #8fc6ae;
      outline-offset: 3px;
    }
    .button:disabled {
      cursor: wait;
      opacity: 0.55;
    }
    .empty {
      padding: 45px 20px;
      border: 1px dashed #cbd4cc;
      border-radius: 12px;
      text-align: center;
      color: var(--muted);
    }
    .empty__title {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-family: Georgia, serif;
      font-size: 19px;
    }
    @media (max-width: 600px) {
      main {
        width: calc(100% - 24px);
        padding-top: 28px;
      }
      .toolbar {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
      }
      .toolbar__tabs {
        width: fit-content;
        max-width: 100%;
        overflow: auto;
      }
      .filter {
        justify-content: space-between;
      }
      .job-card {
        padding: 20px 18px 16px;
      }
      .job-card__title {
        font-size: 21px;
      }
      .job-list {
        gap: 16px;
      }
      .assessment {
        grid-template-columns: 1fr;
      }
      .assessment__header {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .job-card__actions {
        flex-wrap: wrap;
      }
    }
    </style>
  </head>
  <body>
    <main
      x-data="jobReview()"
      @popstate.window="restoreView()"
      @visibilitychange.document="refresh()"
    >
      <h1>Job listings</h1>
      <div class="toolbar">
        <nav class="toolbar__tabs" aria-label="Job status">
          <button
            class="toolbar__tab"
            type="button"
            data-status="active"
            :aria-pressed="status === 'active'"
            @click="selectView({ status: 'active' })"
          >
            Active
          </button>
          <button
            class="toolbar__tab"
            type="button"
            data-status="hidden"
            :aria-pressed="status === 'hidden'"
            @click="selectView({ status: 'hidden' })"
          >
            Hidden
          </button>
          <button
            class="toolbar__tab"
            type="button"
            data-status="rejected"
            :aria-pressed="status === 'rejected'"
            @click="selectView({ status: 'rejected' })"
          >
            Rejected
          </button>
        </nav>
        <label class="filter"
          >Location eligibility
          <select
            id="eligibility"
            class="filter__select"
            :value="eligibility"
            @change="selectView({ eligibility: $event.target.value })"
          >
            <option value="all">All</option>
            <option value="eligible">Eligible</option>
            <option value="pending">Pending</option>
            <option value="unclear">Unclear</option>
            <option value="ineligible">Ineligible</option>
            <option value="error">Error</option>
          </select></label
        >
        <label class="filter"
          >Stack assessment
          <select
            id="stack"
            class="filter__select"
            :value="stack"
            @change="selectView({ stack: $event.target.value })"
          >
            <option value="all">All</option>
            <option value="not_checked">Not checked / Skipped</option>
            <option value="pending">Pending</option>
            <option value="match">Match</option>
            <option value="partial_match">Partial match</option>
            <option value="potential_match">Potential match</option>
            <option value="unclear">Unclear</option>
            <option value="error">Error</option>
          </select></label
        >
      </div>
      <div
        id="notice"
        class="notice"
        :class="{ 'notice--error': saveError || loadError }"
        role="status"
        aria-live="polite"
        x-text="notice"
      ></div>
      <button
        x-cloak
        x-show="loadError"
        class="button"
        type="button"
        @click="load(true)"
      >
        Retry
      </button>
      <section
        id="jobs"
        class="job-list"
        aria-live="polite"
        :aria-busy="loading"
        x-cloak
      >
        <template x-for="job in visibleJobs" :key="job.reviewKey">
          <article
            class="job-card"
            :data-review-key="job.reviewKey"
            :aria-labelledby="`job-title-${job.reviewKey}`"
          >
            <header class="job-card__header">
              <div>
                <h2
                  class="job-card__title"
                  :id="`job-title-${job.reviewKey}`"
                  tabindex="-1"
                  x-text="job.title || 'Untitled role'"
                >
                  Untitled role
                </h2>
              </div>
            </header>
            <template
              x-for="stage in (job.stages || []).filter(item => item.error)"
              :key="stage.stage"
            >
              <p
                class="job-card__error"
                x-text="`${stage.stage}: ${stage.state} — ${stage.error}`"
              ></p>
            </template>
            <div class="job-card__metadata">
              <span
                class="job-card__metadata-item job-card__company"
                x-text="displayText(job.company, 'Company not provided')"
              ></span>
              <span
                class="job-card__metadata-item"
                x-text="`Location: ${displayText(job.location, 'Not provided')}`"
              ></span>
            </div>
            <div class="job-card__assessments">
              <template x-for="panel in assessments(job)" :key="panel.title">
                <section class="assessment">
                  <div class="assessment__header">
                    <h3 class="assessment__title" x-text="panel.title">
                      Assessment
                    </h3>
                    <span
                      class="assessment__status"
                      :class="`assessment__status--${panel.status.replaceAll('_', '-')}`"
                      x-text="panel.label"
                    ></span>
                  </div>
                  <div class="assessment__content">
                    <p
                      class="assessment__reason"
                      :class="{ 'assessment__reason--empty': !panel.reason }"
                      x-text="panel.reason || 'No assessment available yet.'"
                    ></p>
                    <details
                      class="assessment__evidence"
                      x-show="panel.evidence"
                    >
                      <summary class="assessment__toggle">
                        Listing evidence
                      </summary>
                      <blockquote
                        class="assessment__quote"
                        x-text="panel.evidence"
                      ></blockquote>
                    </details>
                  </div>
                </section>
              </template>
            </div>
            <footer class="job-card__actions">
              <!-- biome-ignore lint/a11y/useValidAnchor: Alpine binds the validated listing URL. -->
              <a
                class="job-card__link"
                x-show="safeUrl(job.url)"
                :href="safeUrl(job.url)"
                target="_blank"
                rel="noopener noreferrer"
                >View job ↗</a
              >
              <div class="job-card__review-actions">
                <button
                  class="button"
                  type="button"
                  x-show="status === 'active'"
                  :disabled="!!pending[job.reviewKey]"
                  @click="updateStatus(job, 'hidden')"
                >
                  Hide
                </button>
                <button
                  class="button button--danger"
                  type="button"
                  x-show="status === 'active'"
                  :disabled="!!pending[job.reviewKey]"
                  @click="updateStatus(job, 'rejected')"
                >
                  Reject
                </button>
                <button
                  class="button"
                  type="button"
                  x-show="status !== 'active'"
                  :disabled="!!pending[job.reviewKey]"
                  @click="updateStatus(job, 'active')"
                >
                  Restore
                </button>
              </div>
            </footer>
          </article>
        </template>
        <div
          class="empty"
          x-show="!visibleJobs.length && !loadError && (!loading || cache[status])"
        >
          <strong
            class="empty__title"
            x-text="status === 'active' ? 'Nothing here yet' : `No ${status} jobs`"
          ></strong>
          <span
            x-text="status === 'active' ? 'Jobs will appear after your next run.' : 'Jobs you move here will stay available for review.'"
          ></span>
        </div>
      </section>
    </main>
    <script id="assessment-logic">
    const stackLabel = (job) => {
      const status = job.stack_status || 'not_checked';
      if (status !== 'not_checked') return status.replaceAll('_', ' ');
      if (['ineligible', 'error'].includes(job.eligibility)) return 'Skipped';
      return 'Not checked';
    };
    const matchesLocation = (job, eligibility) => {
      if (eligibility === 'all') return true;
      if (job.eligibility === eligibility) return true;
      if (eligibility !== 'error') return false;
      return (job.stages || []).some(
        (stage) =>
          ['crawl', 'location'].includes(stage.stage) &&
          ['failed', 'terminal'].includes(stage.state),
      );
    };
    const matchesStack = (job, stack) => {
      if (stack === 'all') return true;
      if ((job.stack_status || 'not_checked') === stack) return true;
      if (stack !== 'error') return false;
      return (job.stages || []).some(
        (stage) => stage.stage === 'stack' && stage.state === 'failed',
      );
    };
    const matchesAssessments = (job, eligibility, stack) =>
      matchesLocation(job, eligibility) && matchesStack(job, stack);
    </script>
    <script id="review-component">
    const viewOptions = {
      status: ['active', 'hidden', 'rejected'],
      eligibility: [
        'all',
        'eligible',
        'pending',
        'unclear',
        'ineligible',
        'error',
      ],
      stack: [
        'all',
        'not_checked',
        'pending',
        'match',
        'partial_match',
        'potential_match',
        'unclear',
        'error',
      ],
    };
    const readView = (url) =>
      Object.fromEntries(
        Object.entries(viewOptions).map(([key, values]) => {
          const value = url.searchParams.get(key);
          return [key, values.includes(value) ? value : values[0]];
        }),
      );
    const safeUrl = (value) => {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    };
    const displayText = (value, fallback) =>
      (typeof value === 'string' && value.trim()) || fallback;
    const assessments = (job) => [
      {
        title: 'Location eligibility',
        status: job.eligibility || 'pending',
        label: job.eligibility || 'pending',
        reason: job.reason,
        evidence: job.evidence,
      },
      {
        title: 'Stack match',
        status: job.stack_status || 'not_checked',
        label: stackLabel(job),
        reason: job.stack_reason,
        evidence: job.stack_evidence,
      },
    ];
    const fetchJobs = async (status, signal) => {
      const response = await fetch(`/api/jobs?status=${status}`, { signal });
      const body = await response.json();
      if (!response.ok) throw new Error(body?.error || 'Could not load jobs.');
      if (
        !Array.isArray(body?.jobs) ||
        body.jobs.some(
          (job) => !job || typeof job.reviewKey !== 'string' || !job.reviewKey,
        )
      )
        throw new Error('Invalid jobs response.');
      if (
        new Set(body.jobs.map((job) => job.reviewKey)).size !== body.jobs.length
      )
        throw new Error('Invalid jobs response: duplicate listing keys.');
      return body.jobs;
    };
    window.jobReview = () => {
      // Keep transport handles outside Alpine's reactive proxies.
      let request = null;
      let timer = null;
      return {
        ...readView(new URL(location.href)),
        cache: {},
        pending: {},
        loading: false,
        loadError: '',
        saveError: '',
        message: '',
        safeUrl,
        displayText,
        assessments,
        init() {
          this.load();
          timer = setInterval(() => this.refresh(), 5000);
        },
        destroy() {
          clearInterval(timer);
          this.cancelLoad();
        },
        get visibleJobs() {
          const jobs = new Map(
            (this.cache[this.status] || []).map((job) => [job.reviewKey, job]),
          );
          for (const [key, change] of Object.entries(this.pending)) {
            if (change.to === this.status) jobs.set(key, change.job);
            else jobs.delete(key);
          }
          return [...jobs.values()].filter((job) =>
            matchesAssessments(job, this.eligibility, this.stack),
          );
        },
        get notice() {
          if (this.saveError || this.loadError)
            return this.saveError || this.loadError;
          if (this.message) return this.message;
          if (this.loading && !this.cache[this.status]) return 'Loading…';
          const count = this.visibleJobs.length;
          return count ? `${count} ${count === 1 ? 'job' : 'jobs'}` : '';
        },
        async selectView(values, writeHistory = true) {
          if (
            Object.entries(values).every(([key, value]) => this[key] === value)
          )
            return;
          const previousStatus = this.status;
          await this.preservePosition(() => {
            Object.assign(this, values);
            this.saveError = '';
            this.loadError = '';
            this.message = '';
          });
          if (writeHistory) {
            const url = new URL(location.href);
            for (const key of Object.keys(viewOptions)) {
              if (this[key] === viewOptions[key][0])
                url.searchParams.delete(key);
              else url.searchParams.set(key, this[key]);
            }
            history.pushState(null, '', url);
          }
          if (previousStatus !== this.status) return this.load(true);
        },
        restoreView() {
          return this.selectView(readView(new URL(location.href)), false);
        },
        refresh() {
          if (document.hidden) return;
          return this.load();
        },
        cancelLoad() {
          request?.abort();
          request = null;
          this.loading = false;
        },
        async load(force = false) {
          if (request && !force) return;
          this.cancelLoad();
          const controller = new AbortController();
          request = controller;
          const status = this.status;
          this.loading = true;
          try {
            const jobs = await fetchJobs(status, controller.signal);
            if (request !== controller || this.status !== status) return;
            await this.preservePosition(() => {
              this.cache[status] = jobs;
              this.loadError = '';
            });
          } catch (error) {
            if (request !== controller) return;
            await this.preservePosition(() => {
              this.loadError = error.message || 'Could not load jobs.';
            });
          } finally {
            if (request === controller) {
              request = null;
              this.loading = false;
            }
          }
        },
        async updateStatus(job, to) {
          const key = job.reviewKey;
          if (this.pending[key]) return;
          const from = this.status;
          const index = (this.cache[from] || []).findIndex(
            (item) => item.reviewKey === key,
          );
          this.cancelLoad();
          await this.preservePosition(() => {
            this.pending[key] = { from, to, job };
            this.saveError = '';
            this.message = '';
          });
          try {
            const response = await fetch('/api/jobs/status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ reviewKey: key, status: to }),
            });
            const body = await response.json();
            if (!response.ok || body?.ok !== true)
              throw new Error(body?.error || 'Could not save that change.');
          } catch (error) {
            await this.preservePosition(() => {
              const jobs = this.cache[from] || [];
              if (!jobs.some((item) => item.reviewKey === key)) {
                const restored = [...jobs];
                restored.splice(Math.max(index, 0), 0, job);
                this.cache[from] = restored;
              }
              delete this.pending[key];
              this.saveError = `${error.message || 'Could not save that change.'} Try again.`;
            });
            return;
          }
          // A read started before the save completed cannot establish current membership.
          this.cancelLoad();
          await this.preservePosition(() => {
            for (const status of Object.keys(this.cache)) {
              this.cache[status] = this.cache[status].filter(
                (item) => item.reviewKey !== key,
              );
            }
            if (this.cache[to]) this.cache[to].push(job);
            delete this.pending[key];
          });
          await this.load(true);
          if (
            to === 'active' &&
            job.stages?.some((stage) => stage.state === 'pending')
          )
            this.message =
              'Restored with unfinished checks. Run pnpm job-hunter repair to restore missing queue work.';
        },
        async preservePosition(change) {
          const cards = [...document.querySelectorAll('.job-card')];
          const positions = cards.map((card) => ({
            key: card.dataset.reviewKey,
            top: card.getBoundingClientRect().top,
            bottom: card.getBoundingClientRect().bottom,
          }));
          const firstVisible = positions.findIndex(
            (position) => position.bottom > 0,
          );
          const anchors =
            firstVisible < 0
              ? []
              : [
                  ...positions.slice(firstVisible),
                  ...positions.slice(0, firstVisible).reverse(),
                ];
          const focused = cards.findIndex((card) =>
            card.contains(document.activeElement),
          );
          const focusOrder =
            focused < 0
              ? []
              : [
                  ...cards.slice(focused + 1),
                  ...cards.slice(0, focused).reverse(),
                ].map((card) => card.dataset.reviewKey);
          const activeElement = document.activeElement;
          change();
          await this.$nextTick();
          const remaining = new Map(
            [...document.querySelectorAll('.job-card')].map((card) => [
              card.dataset.reviewKey,
              card,
            ]),
          );
          const anchor = anchors.find((position) =>
            remaining.has(position.key),
          );
          if (anchor)
            window.scrollBy(
              0,
              remaining.get(anchor.key).getBoundingClientRect().top -
                anchor.top,
            );
          if (focused < 0 || activeElement.isConnected) return;
          const nextKey = focusOrder.find((key) => remaining.has(key));
          const target = nextKey
            ? remaining.get(nextKey).querySelector('h2')
            : document.querySelector(`[data-status="${this.status}"]`);
          target?.focus({ preventScroll: true });
        },
      };
    };
    </script>
  </body>
</html>
